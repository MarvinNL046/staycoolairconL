name: Notify search engines after production deployment
on:
  deployment_status:
permissions:
  contents: read
  actions: read
concurrency:
  group: indexnow-production
  cancel-in-progress: false
jobs:
  notify:
    if: github.event.deployment_status.state == 'success' && (github.event.deployment.environment == 'Production' || github.event.deployment.environment == 'production')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.deployment.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # deployment_status has no branch ref, so actions/cache cannot persist state.
      - name: Find previous notification result
        id: previous
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.actions.listWorkflowRuns({
              ...context.repo, workflow_id: 'indexnow.yml', status: 'success', per_page: 100
            });
            for (const run of data.workflow_runs) {
              if (run.id === context.runId || run.event !== 'deployment_status') continue;
              const { data: result } = await github.rest.actions.listWorkflowRunArtifacts({
                ...context.repo, run_id: run.id
              });
              if (result.artifacts.some(a => a.name === 'indexnow-result' && !a.expired)) {
                core.setOutput('run-id', String(run.id));
                break;
              }
            }
      - uses: actions/download-artifact@v4
        if: steps.previous.outputs.run-id != ''
        with:
          name: indexnow-result
          path: .cache/indexnow/previous
          github-token: ${{ github.token }}
          run-id: ${{ steps.previous.outputs.run-id }}
      - name: Restore accepted revisions
        if: steps.previous.outputs.run-id != ''
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          const previous = JSON.parse(await fs.readFile('.cache/indexnow/previous/last-run.json', 'utf8'));
          if (!previous.state || typeof previous.state !== 'object' || Array.isArray(previous.state)) throw new Error('Missing notification state');
          for (const [url, revision] of Object.entries(previous.state)) {
            if (new URL(url).origin !== 'https://staycoolairco.nl' || !/^[a-f0-9]{64}$/.test(revision)) throw new Error('Invalid notification state');
          }
          await fs.writeFile('.cache/indexnow/state.json', JSON.stringify(previous.state));
          console.log(`Restored ${Object.keys(previous.state).length} accepted revisions`);
          NODE
      - name: Verify published pages and notify IndexNow
        run: node scripts/indexnow.mjs --live-manifest --submit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: indexnow-result
          path: .cache/indexnow/last-run.json
